name: CI - Dockerized Rails App

on:
  push:
  pull_request:
    branches:
      - main
    

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres" --health-timeout=5s --health-start-period=10s --health-interval=10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        run: docker-compose -f docker-compose.yml build

      - name: Run database migrations
        run: docker-compose run web bin/rails db:create db:migrate

      - name: Run tests
        run: docker-compose run web bundle exec rspec

